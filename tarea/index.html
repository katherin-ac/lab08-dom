<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de tareas</title>
    <style>
      :root {
        --color-fondo: #f4f6f8;
        --color-superficie: #ffffff;
        --color-texto: #202124;
        --color-primario: #2457c5;
        --espaciado: 12px;
        --radio-borde: 10px;
      }
      body {
        font-family: Arial, sans-serif;
        max-width: 640px;
        margin: 30px auto;
        padding: var(--espaciado);
        background-color: var(--color-fondo);
        color: var(--color-texto);
      }
      section {
        background-color: var(--color-superficie);
        padding: calc(var(--espaciado) * 2);
        border-radius: var(--radio-borde);
        margin-bottom: 20px;
      }
      input,
      select,
      button {
        padding: 10px;
        margin: 2px 0;
        box-sizing: border-box;
        font-size: 15px;
      }

      button {
        min-height: 37px;
        cursor: pointer;
      }
      li span {
        display: inline-block;
        margin-right: 10px;
      }
      li button {
        margin-left: 5px;
      }
      button {
        background-color: var(--color-primario);
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 12px 16px;
        min-height: 44px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: #19439b;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #f0a202;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <h1>Mi lista de tareas</h1>

    <section>
      <h2>Agregar tarea</h2>

      <form id="formTarea">
        <label for="nuevaTarea">Nombre de la tarea</label>

        <input type="text" id="nuevaTarea" placeholder="Ej. Estudiar Cálculo" />

        <button type="submit">Agregar</button>
        <p id="mensaje" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section>
      <h2>Mis tareas pendientes</h2>
      <ul id="listaTareas"></ul>
    </section>

    <script src="app.js"></script>
  </body>
</html>
